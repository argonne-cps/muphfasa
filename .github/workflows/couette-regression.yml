name: Couette regression

# Builds the plane-Couette regression test and checks:
#   1. convergence.py / convergence3d.py: grid-convergence order (vx vs analytic)
#   2. plot_couette.py / plot_couette3d.py: startup-transient profile and n=1 decay rate
# See tests/regression/couette/README.md for what each script does.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/regression/couette/**'
      - 'external/amrex'
      - '.github/workflows/couette-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/regression/couette/**'
      - 'external/amrex'
      - '.github/workflows/couette-regression.yml'
  workflow_dispatch:

jobs:
  couette:
    name: Convergence + decay-rate check (2D + 3D)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository (with AMReX submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install numpy matplotlib

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Resolve AMReX submodule commit (cache key)
        id: amrex
        run: echo "sha=$(git -C external/amrex rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: couette-ccache-${{ runner.os }}-amrex-${{ steps.amrex.outputs.sha }}
          restore-keys: |
            couette-ccache-${{ runner.os }}-amrex-

      - name: Configure ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

      - name: Build test_couette (2-D)
        working-directory: tests/regression/couette
        run: make -j"$(nproc)"

      - name: Build test_couette (3-D)
        working-directory: tests/regression/couette
        run: make -j"$(nproc)" DIM=3

      - name: Grid-convergence study (2-D)
        working-directory: tests/regression/couette
        run: python3 convergence.py --ny-list 16 32 64 --min-order 2.5

      - name: Grid-convergence study (3-D)
        working-directory: tests/regression/couette
        run: python3 convergence3d.py --ny-list 16 32 64 --min-order 2.5

      - name: Startup-transient profile + decay-rate check (2-D)
        working-directory: tests/regression/couette
        run: python3 plot_couette.py --max-profile-err 0.01 --max-rate-rel-err 0.01

      - name: Startup-transient profile + decay-rate check (3-D)
        working-directory: tests/regression/couette
        run: python3 plot_couette3d.py --max-profile-err 0.01 --max-rate-rel-err 0.01

      - name: Upload plots and data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: couette-regression-results
          path: |
            tests/regression/couette/couette_convergence.png
            tests/regression/couette/couette_convergence.csv
            tests/regression/couette/couette_decay.png
            tests/regression/couette/couette3d_convergence.png
            tests/regression/couette/couette3d_convergence.csv
            tests/regression/couette/couette3d_decay.png
          if-no-files-found: ignore
