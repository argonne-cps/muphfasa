name: Lid2D regression

# Builds the 2-D lid-driven cavity (Re=100) regression test, runs its global
# checks (mass, KE spin-up/plateau, energy balance, centerline extrema vs. the
# Marchi et al. 2009 benchmark), then checks grid-convergence order and the
# finest-grid benchmark error via convergence.py. plot_lid2d.py (KE / steady-state
# plots) is not run in CI -- see tests/regression/lid2d/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/regression/lid2d/**'
      - 'external/amrex'
      - '.github/workflows/lid2d-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/regression/lid2d/**'
      - 'external/amrex'
      - '.github/workflows/lid2d-regression.yml'
  workflow_dispatch:

jobs:
  lid2d:
    name: Global checks and convergence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository (with AMReX submodule)
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install numpy matplotlib

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Resolve AMReX submodule commit (cache key)
        id: amrex
        run: echo "sha=$(git -C external/amrex rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # AMReX itself rarely changes; caching its compiled objects via ccache
      # is what keeps this job fast after the first run on a given submodule
      # commit (a full rebuild from scratch takes ~2 CPU-minutes x NPROC).
      - name: Cache ccache
        uses: actions/cache@main
        with:
          path: ~/.ccache
          key: lid2d-ccache-${{ runner.os }}-amrex-${{ steps.amrex.outputs.sha }}
          restore-keys: |
            lid2d-ccache-${{ runner.os }}-amrex-

      - name: Configure ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

      - name: Build test_lid2d (2-D)
        working-directory: tests/regression/lid2d
        run: make -j"$(nproc)"

      - name: Run lid2d global checks (N=64)
        working-directory: tests/regression/lid2d
        # ~2 s. Exits non-zero if any check fails: mass drift, KE spin-up /
        # plateau, energy balance, or an extremum more than 1% from the
        # Marchi et al. (2009) benchmark.
        run: ./test_lid2d2d.gnu.ex inputs

      - name: Grid-convergence study
        working-directory: tests/regression/lid2d
        # N = 32/64/128 at fixed tau, 40 convective times each (~1 min).
        # Observed order is ~1.9-2.1 locally (second-order LBM with halfway
        # bounce-back); --min-order leaves margin for platform noise while
        # still catching a real regression. The finest grid must also be
        # within --max-bench-err (default 1%; ~0.1% locally) of the benchmark.
        run: python3 convergence.py --ncells 32 64 128 --min-order 1.8

      - name: Upload plots and data
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: lid2d-regression-results
          path: |
            tests/regression/lid2d/lid2d_convergence.png
            tests/regression/lid2d/lid2d_convergence.csv
          if-no-files-found: ignore
