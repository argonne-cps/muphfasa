name: Build check (MPI+SYCL)

# Compile-only check that the solver builds with GNUMake, MPI and the SYCL
# backend using the Intel oneAPI compiler -- the same setup as a local
#   make -j$(nproc) DIM=3 COMP=intel USE_SYCL=TRUE
# COMP=intel resolves to icpx (intel.mak detects the LLVM-based compiler and
# includes intel-llvm.mak), and USE_SYCL=TRUE forces COMP=sycl, whose
# dpcpp.mak also uses icpx plus -fsycl.
#
# MPI is MPICH (libmpich-dev/mpich), not OpenMPI, to match Aurora at ALCF,
# which ships Cray MPICH. The build step exports MPICH_CXX=icpx because
# USE_MPI=TRUE switches compilation to the mpicxx wrapper, whose stock
# default is g++. oneMKL is installed alongside the compiler:
# AMReX_RandomEngine.H includes <oneapi/mkl/rng.hpp> unconditionally under
# AMREX_USE_SYCL, and dpcpp.mak links with -qmkl=sequential. No GPU is
# needed on the runner: SYCL compilation targets SPIR-V/host on plain CPUs.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'GNUmakefile'
      - 'Make.muphfasa'
      - 'external/amrex'
      - '.github/workflows/build-mpi-sycl.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'GNUmakefile'
      - 'Make.muphfasa'
      - 'external/amrex'
      - '.github/workflows/build-mpi-sycl.yml'
  workflow_dispatch:

jobs:
  build-mpi-sycl:
    name: GNUMake DIM=${{ matrix.dim }} (MPI+SYCL, icpx, MPICH)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dim: [2, 3]
    steps:
      - name: Check out repository (with AMReX submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      # MPICH
      - name: Install MPICH and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpich-dev mpich wget gnupg

      # Intel oneAPI DPC++ provides icpx, the compiler AMReX's GNUMake uses
      # for both COMP=intel (intel-llvm.mak) and COMP=sycl (dpcpp.mak).
      # intel-oneapi-mkl-devel ships the oneapi/mkl headers, intel-oneapi-mkl
      # the libraries that -qmkl=sequential links against.
      - name: Install Intel oneAPI DPC++ (icpx) and oneMKL
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel intel-oneapi-mkl

      - name: Build (GNUMake, DIM=${{ matrix.dim }}, MPI+SYCL)
        # Compile only -- running the SYCL binary needs a GPU (or a CPU SYCL
        # runtime), which is out of scope for this check. USE_SYCL=TRUE
        # forces COMP=sycl (icpx); AMReX's GNUMake disables ccache for SYCL
        # builds, so none is used here either.
        #
        # USE_MPI=TRUE switches the compiler to the mpicxx wrapper
        # (sites/Make.unknown). Stock MPICH's wrapper would call g++, which
        # rejects the icpx/SYCL flags, so point it at icpx via MPICH_CXX --
        # the same env var AMReX itself exports for HIP/CUDA (Make.defs).
        run: |
          source /opt/intel/oneapi/setvars.sh
          export MPICH_CXX=icpx MPICH_CC=icx
          # setvars.sh puts MKL on the search path; make the include/lib dirs
          # explicit so <oneapi/mkl/rng.hpp> resolves regardless.
          export MKLROOT=${MKLROOT:-/opt/intel/oneapi/mkl/latest}
          export CPATH="$MKLROOT/include:$CPATH"
          export LIBRARY_PATH="$MKLROOT/lib:$LIBRARY_PATH"
          make -j"$(nproc)" DIM=${{ matrix.dim }} USE_MPI=TRUE USE_SYCL=TRUE
